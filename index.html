<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' draws an opaque white status bar on iOS PWA, which
         clashes with the dark/cream theme. 'black-translucent' lets
         the page background show through under the status bar so the
         app feels edge-to-edge. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bugün Ne Var" />
